<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ViMax Preview</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div id="app" @click="charPickerShot = null">

  <!-- 顶部栏 -->
  <div class="topbar">
    <h1>ViMax Preview</h1>
    <select class="project-select" v-model="currentProject">
      <option v-for="p in projects" :key="p" :value="p">{{ p }}</option>
    </select>
    <span class="badge" v-if="characters.length">{{ characters.length }} 角色</span>
    <span class="badge" v-if="shots.length">{{ shots.length }} 镜头</span>
  </div>

  <!-- Tab 导航 -->
  <div class="tabs">
    <button class="tab-btn" :class="{active: activeTab==='extract_characters'}"    @click="activeTab='extract_characters'">① 脚本</button>
    <button class="tab-btn" :class="{active: activeTab==='generate_portraits'}"    @click="activeTab='generate_portraits'">② 人物</button>
    <button class="tab-btn" :class="{active: activeTab==='design_storyboard'}"     @click="activeTab='design_storyboard'">③ 分镜</button>
    <button class="tab-btn" :class="{active: activeTab==='decompose_descriptions'}" @click="activeTab='decompose_descriptions'">④ 描述</button>
    <button class="tab-btn" :class="{active: activeTab==='construct_camera_tree'}" @click="activeTab='construct_camera_tree'">⑤ 机位</button>
    <button class="tab-btn" :class="{active: activeTab==='generate_frames'}"       @click="activeTab='generate_frames'">⑥ 帧</button>
    <button class="tab-btn" :class="{active: activeTab==='generate_videos'}"       @click="activeTab='generate_videos'">⑦ 视频</button>
    <button class="tab-btn" :class="{active: activeTab==='concatenate'}"           @click="activeTab='concatenate'">⑧ 最终视频</button>
  </div>

  <!-- 主内容（各 Tab 由服务端从 static/tabs/ 拼入） -->
  <div class="content">
    <div v-if="loading" class="loading">加载中...</div>
    <div v-else-if="!currentProject" class="empty">请选择项目</div>

<!-- TABS_PLACEHOLDER -->

  </div>

  <!-- ══ Lightbox ══ -->
  <div class="modal-overlay" v-if="lightboxUrl" @click.self="lightboxUrl=null">
    <img class="lightbox-img" :src="lightboxUrl" alt="preview" @click.stop />
    <button class="lightbox-close" @click="lightboxUrl=null">✕</button>
  </div>

  <!-- ══ 替换 Modal ══ -->
  <div class="modal-overlay" v-if="modal" @click.self="closeModal">
    <div class="modal">
      <h3>{{ modal.title }}</h3>
      <img v-if="modal.previewUrl" class="modal-preview" :class="{portrait: modal.isPortrait}"
        :src="modal.previewUrl" alt="preview" />
      <div class="upload-zone" @click="triggerUploadInput">
        <input id="upload-input" type="file" accept="image/*" @change="onFileSelected" />
        <p>
          <strong>点击选择</strong> 图片替换<br/>
          <span v-if="modal.pendingFile" style="color:#a78bfa">已选择: {{ modal.pendingFile.name }}</span>
          <span v-else>支持 PNG / JPG / WEBP</span>
        </p>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" @click="closeModal">取消</button>
        <button class="btn btn-primary" :disabled="!modal.pendingFile || modal.uploading" @click="modal.upload()">
          {{ modal.uploading ? '上传中...' : '确认替换' }}
        </button>
      </div>
    </div>
  </div>

  <!-- ══ Toast ══ -->
  <div class="toast" :class="toast.type" v-if="toast">{{ toast.msg }}</div>

</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script type="module" src="/static/app.js"></script>
</body>
</html>
